name: Real OpenAI generation smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model to use (must be explicitly supplied)
        required: true
        type: string
  push:
    branches:
      - stage3b-generation
    paths:
      - .github/workflows/real-openai-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gpt-5.6-sol' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Refuse unconfigured secret
        run: test -n "$OPENAI_API_KEY"
      - run: python tests/real_openai_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-openai-generation-smoke
          path: work/real-openai-smoke.json
          if-no-files-found: error

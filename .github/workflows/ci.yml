name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: black --check app migrations tests
      - run: ruff check .
      - run: pytest
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/stage1_smoke_ci
      OPERATOR_PASSWORD: ci-operator-password
      SESSION_SECRET: ci-session-secret-with-more-than-32-characters
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -c 'CREATE DATABASE stage1_smoke_ci'
      - run: python tests/postgres_smoke.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm audit
